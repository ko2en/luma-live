<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LUMA · 直播间</title>
<meta name="description" content="经 TURN 中继的轻量自建直播间：视频、聊天、零安装。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e8462f'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://registry.npmmirror.com" crossorigin>
<link rel="stylesheet" href="https://registry.npmmirror.com/lxgw-wenkai-webfont/1.7.0/files/lxgwwenkai-regular.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/lxgw-wenkai-webfont/1.7.0/files/lxgwwenkai-bold.css">
<link rel="stylesheet" href="/styles.css?v=24" />
</head>
<body>
<div class="ambient"></div>

<header class="topbar">
  <a class="brand" href="/" aria-label="LUMA 首页">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="4" y="13" width="3.4" height="7" rx="1.2" opacity=".55"/><rect x="10.3" y="8.5" width="3.4" height="11.5" rx="1.2" opacity=".82"/><rect x="16.6" y="4" width="3.4" height="16" rx="1.2"/></svg>
    </span>
    <span class="brand-word">LUMA</span>
  </a>

  <div class="topbar-mid">
    <span class="live-pill is-off" data-live-badge><i></i>OFFLINE</span>
    <span class="topbar-title" data-title-echo>直播间</span>
  </div>

  <div class="topbar-right">
    <span class="stat">
      <span class="stat-num" data-viewers>0</span>
      <span class="stat-label">在看</span>
    </span>
    <a class="ghost-btn" href="/studio">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="m15 12 4 2.5v-9L15 8"/></svg>
      开播控制台
    </a>
    <span class="auth-slot" data-auth hidden></span>
  </div>
</header>

<main class="shell">
  <section class="stage">
    <div class="player" data-player>
      <div class="player-grid"></div>
      <video data-video playsinline autoplay muted></video>

      <div class="player-idle" data-idle>
        <div class="signal-bars"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="idle-title" data-idle-title>主播还没有开播</div>
        <div class="idle-sub" data-idle-sub>直播间已就绪。主播在控制台点击「开始直播」后，画面会自动出现在这里。</div>
      </div>

      <div class="player-overlay-top">
        <span class="overlay-clock" data-uptime hidden>00:00:00</span>
        <span class="overlay-muted" data-muted-note hidden>静音中</span>
      </div>

      <span class="player-badge-corner" data-connection-type="idle" aria-live="polite" title="媒体尚未连接，是否使用 TURN 中继尚未确定。">未连接</span>

      <button class="fullscreen-btn" data-fullscreen type="button" aria-label="全屏播放" title="全屏播放">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/></svg>
        <span>全屏</span>
      </button>

      <button class="unmute-btn" data-unmute hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
        开启声音
      </button>
    </div>

    <div class="meta">
      <h1 data-title>正在连接直播间…</h1>
      <div class="byline">
        <span class="avatar" data-avatar>–</span>
        <div class="byline-text">
          <div class="byline-name" data-streamer>等待主播</div>
        </div>
        <div class="meta-stats">
          <div class="meta-stat"><span class="k">本场时长</span><span class="v" data-uptime-2>--:--</span></div>
          <div class="meta-stat"><span class="k">同时在看</span><span class="v" data-viewers-2>0</span></div>
        </div>
      </div>

      <div class="audience" data-audience hidden>
        <span class="audience-k">在场</span>
        <span class="audience-list" data-audience-list></span>
      </div>

      <div class="stage-foot">
        <div class="foot-item">
          <span class="k">线路</span>
          <span class="v" data-line-label>连接中…</span>
        </div>
        <div class="foot-item foot-share">
          <span class="k">分享</span>
          <button class="mini-btn" data-share type="button">
            复制观看链接
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <aside class="chat" data-chat>
    <div class="chat-head">
      <h2>聊天室</h2>
      <span class="chat-count" data-chat-count>0</span>
      <button class="chat-close" data-chat-close type="button">收起</button>
    </div>

    <div class="chat-list" data-chat-list>
      <div class="chat-empty" data-chat-empty>还没有人说话<br />你是第一个。</div>
    </div>

    <form class="chat-form" data-chat-form autocomplete="off">
      <span class="name-chip name-chip-static" data-name title="当前登录账号">读取中…</span>
      <input data-chat-input maxlength="200" placeholder="说点什么…" />
      <button class="send" type="submit" data-send>发送</button>
    </form>
  </aside>
</main>

<button class="chat-fab" data-chat-open type="button">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.4-4.2A8 8 0 1 1 21 12Z"/></svg>
  聊天室
  <span class="fab-badge" data-fab-badge hidden>0</span>
</button>

<div class="toast" data-toast></div>

<script src="/viewer.js?v=31"></script>
<script src="/auth-ui.js?v=2"></script>
</body>
</html>
